[workspace]
members = [
  "libregister",
  "libcortex_a9",
  "libboard_zynq",
  "libsupport_zynq",
  "libasync",
  "libconfig",
  "libcoreio",
  "experiments",
  "szl",
]

[profile.release]
panic = "abort"
debug = true
codegen-units = 1
opt-level = 'z'
lto = true
debug-assertions = false
overflow-checks = false

[patch.crates-io]
core_io = { path = "./libcoreio" }
